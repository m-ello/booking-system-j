<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Table booking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
    <style>

        :root {
            --bg: #f0f6f1;
            --card: #fffefa;
            --ink: #194b27;
            --mute: #81877e;
            --line: #e9e8df;
            --brand: #496c56;
            --on-brand: #ffffff;
            --seat: #194b1f;
            --ok: #4f805f;
            --bad: #b66b60;
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.6 "Segoe UI", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Typography */

        h1, .brand {
            font-family: "Bricolage Grotesque", sans-serif;
            font-weight: 700;
            letter-spacing: -.035em;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 8px;
            color: var(--ink);
        }

        p {
            margin-top: 12px;
        }

        /* Header */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 18px max(24px, calc((100% - 1120px) / 2));
            background: rgba(255, 254, 250, .92);
            border-bottom: 1px solid var(--line);
        }

        .brand {
            font-size: 1.35rem;
            color: var(--brand);
        }

        #who {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Main layout */

        main {
            max-width: 780px;
            margin: 0 auto;
            padding: 42px 24px 90px;
        }

        /* Cards */

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 26px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(52, 62, 47, .035);
        }

        /* Labels and inputs */

        label {
            display: block;
            font-size: .82rem;
            font-weight: 600;
            letter-spacing: .025em;
            color: var(--mute);
            margin: 16px 0 7px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 9px;
            background: #faf9f5;
            color: var(--ink);
            font: inherit;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        input:hover, select:hover {
            border-color: #b8c9b9;
        }

        input:focus, select:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(73, 108, 86, .10);
        }

        /* Buttons */

        button {
            cursor: pointer;
            border: 1px solid var(--brand);
            border-radius: 9px;
            padding: 11px 20px;
            font: inherit;
            font-weight: 600;
            background: var(--brand);
            color: var(--on-brand);
            transition: background .2s, transform .2s, box-shadow .2s;
        }

        button:hover {
            background: #385844;
            box-shadow: 0 4px 12px rgba(55, 85, 65, .15);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button.ghost {
            background: transparent;
            color: var(--ink);
            border-color: var(--line);
            box-shadow: none;
        }

        button.ghost:hover {
            background: #f3f3ec;
            border-color: #cbd4c9;
        }

        button.small {
            padding: 8px 14px;
            font-size: .84rem;
        }

        /* Keyboard accessibility */

        :focus-visible {
            outline: 3px solid var(--seat);
            outline-offset: 3px;
        }

        /* Tabs */

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .tabs button {
            background: transparent;
            color: var(--mute);
            border-color: transparent;
            border-radius: 9px;
            padding: 9px 17px;
            box-shadow: none;
        }

        .tabs button:hover {
            background: #eeefe8;
            color: var(--ink);
            transform: none;
        }

        .tabs button.on {
            background: var(--brand);
            color: white;
            border-color: var(--brand);
        }

        /* Form rows */

        .row {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .row > * {
            flex: 1;
            min-width: 150px;
        }

        /* Booking and table items */

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 18px 0;
            border-top: 1px solid var(--line);
        }

        .item:first-of-type {
            border-top: 0;
        }

        .item strong {
            font-weight: 650;
            color: var(--ink);
        }

        .seats {
            color: var(--seat);
            letter-spacing: 3px;
            font-size: .85rem;
        }

        /* Status pills */

        .pill {
            display: inline-block;
            font-size: .76rem;
            padding: 3px 10px;
            border-radius: 99px;
            border: 1px solid var(--line);
            color: var(--mute);
            background: #f8f7f2;
            margin-left: 6px;
        }

        .pill.CONFIRMED {
            color: #477a54;
            border-color: #c6dcc9;
            background: #edf5ed;
        }

        .pill.CANCELLED {
            color: #a75b53;
            border-color: #e6c9c4;
            background: #fbefec;
        }

        /* Supporting text */

        .muted {
            color: var(--mute);
            font-size: .88rem;
        }

        /* Notifications */

        #msg {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%);
            padding: 13px 22px;
            border-radius: 10px;
            background: #29372f;
            color: white;
            display: none;
            max-width: 90%;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .12);
            z-index: 10;
        }

        /* Responsive layout */

        @media (max-width: 600px) {
            header {
                padding: 16px 18px;
            }

            main {
                padding: 26px 16px 70px;
            }

            .card {
                padding: 20px;
                border-radius: 12px;
            }

            h1 {
                font-size: 1.55rem;
            }

            .row {
                gap: 6px;
            }

            .row > * {
                min-width: 100%;
            }

            .item {
                gap: 10px;
            }

            .item button {
                flex-shrink: 0;
            }
        }

        [hidden] {
            display: none !important;
        }

    </style>
</head>
<body>
<header>
    <span class="brand">Table booking</span>
    <div id="who" hidden><span id="email" class="muted"></span><span id="role" class="pill"></span> <button class="ghost small" id="logout">Log out</button></div>
</header>
<main>
    <section id="auth" class="card" hidden>
        <h1>Welcome</h1>
        <p class="muted">Log in to book a table, or create an account.</p>
        <div class="tabs"><button data-auth="login" class="on">Log in</button><button data-auth="register">Register</button></div>
        <form id="authForm">
            <label for="e">Email</label><input id="e" type="email" required autocomplete="email">
            <label for="p">Password (at least 8 characters)</label><input id="p" type="password" required minlength="8" autocomplete="current-password">
            <p><button id="authBtn">Log in</button></p>
        </form>
    </section>

    <section id="app" hidden>
        <div class="tabs" id="tabs">
            <button data-tab="book" class="on">Find a table</button>
            <button data-tab="mine">My bookings</button>
            <button data-tab="all" id="allTab" hidden>All bookings</button>
            <button data-tab="admin" id="adminTab" hidden>Manage tables</button>
        </div>

        <div id="book">
            <form id="searchForm" class="card">
                <h1>Find a table</h1>
                <div class="row">
                    <div><label for="start">Date and time</label><input id="start" type="datetime-local" required></div>
                    <div><label for="dur">Stay for</label><select id="dur"><option value="60">1 hour</option><option value="90">1.5 hours</option><option value="120" selected>2 hours</option><option value="180">3 hours</option></select></div>
                    <div><label for="party">Guests</label><input id="party" type="number" min="1" max="50" value="2" required></div>
                </div>
                <p><button>Show free tables</button></p>
            </form>
            <div id="results" class="card" hidden></div>
        </div>

        <div id="mine" class="card" hidden></div>

        <div id="all" hidden>
            <form id="filterForm" class="card">
                <h1>All bookings</h1>
                <div class="row">
                    <div><label for="fs">Status</label><select id="fs"><option value="">Any</option><option>CONFIRMED</option><option>CANCELLED</option><option>PENDING</option></select></div>
                    <div><label for="ft">Table</label><select id="ft"><option value="">Any</option></select></div>
                    <div><label for="fe">Guest email contains</label><input id="fe" type="text"></div>
                </div>
                <div class="row">
                    <div><label for="ff">From date</label><input id="ff" type="date"></div>
                    <div><label for="fto">To date</label><input id="fto" type="date"></div>
                    <div><label for="fo">Order</label><select id="fo"><option value="desc">Latest first</option><option value="asc">Earliest first</option></select></div>
                </div>
                <p><button>Apply filters</button> <button type="button" class="ghost" id="fclear">Clear</button></p>
            </form>
            <div id="allList" class="card"></div>
        </div>

        <div id="admin" hidden>
            <form id="tableForm" class="card">
                <h1 id="formTitle">Add a table</h1>
                <div class="row">
                    <div><label for="tl">Name</label><input id="tl" required maxlength="100" placeholder="T7"></div>
                    <div><label for="ts">Seats</label><input id="ts" type="number" min="1" max="50" value="4" required></div>
                    <div><label for="tz">Area</label><select id="tz"><option>INDOOR</option><option>TERRACE</option><option>BAR</option><option>PRIVATE</option></select></div>
                </div>
                <label for="td">Note (optional)</label><input id="td" maxlength="500" placeholder="By the window">
                <label for="ta"><input id="ta" type="checkbox" checked>Available for booking</label>
                <p><button id="tableBtn">Add table</button> <button type="button" class="ghost" id="tableCancel" hidden>Stop editing</button></p>
            </form>
            <div id="tables" class="card"></div>
        </div>
    </section>
</main>
<div id="msg" role="status"></div>

<script>
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const fmt = d => new Date(d).toLocaleString([], {dateStyle:'medium', timeStyle:'short'});
    const clock = d => new Date(d).toLocaleTimeString([], {timeStyle:'short'});
    let token = localStorage.getItem('token'), authMode = 'login', query = null;

    function parse(t){
        try { const p = JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); return p.exp*1000 > Date.now() ? p : null; }
        catch { return null; }
    }
    function toast(t){ const m=$('#msg'); m.textContent=t; m.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>m.style.display='none',3500); }

    async function api(path, opts = {}){
        const res = await fetch('/api'+path, {...opts, headers:{'Content-Type':'application/json', ...(token ? {Authorization:'Bearer '+token} : {})}});
        if (res.status === 401 && token){ logout(); throw new Error('Your session expired. Log in again.'); }
        if (res.status === 403) throw new Error('Your account cannot do that.');
        const body = res.status === 204 ? null : await res.json().catch(() => null);
        if (!res.ok){
            const fields = body?.errors ? Object.values(body.errors).join(', ') : null;
            throw new Error(fields || body?.detail || 'Request failed (' + res.status + ')');
        }
        return body;
    }

    function show(){
        const me = token && parse(token);
        if (!me){ token = null; localStorage.removeItem('token'); }
        $('#auth').hidden = !!me; $('#app').hidden = !me; $('#who').hidden = !me;
        if (me){ $('#email').textContent = me.email; $('#role').textContent = me.role; $('#adminTab').hidden = me.role !== 'ADMIN'; $('#allTab').hidden = me.role !== 'ADMIN'; tab('book'); }
    }
    function logout(){ token = null; localStorage.removeItem('token'); show(); }

    function tab(name){
        document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
        ['book','mine','all','admin'].forEach(n => $('#'+n).hidden = n !== name);
        if (name === 'mine') loadMine();
        if (name === 'all') loadAll(0);
        if (name === 'admin') loadTables();
    }

    document.querySelectorAll('[data-auth]').forEach(b => b.onclick = () => {
        authMode = b.dataset.auth;
        document.querySelectorAll('[data-auth]').forEach(x => x.classList.toggle('on', x === b));
        $('#authBtn').textContent = b.textContent;
        $('#p').autocomplete = authMode === 'login' ? 'current-password' : 'new-password';
    });
    $('#authForm').onsubmit = async e => {
        e.preventDefault();
        try {
            const r = await api('/auth/' + authMode, {method:'POST', body:JSON.stringify({email:$('#e').value, password:$('#p').value})});
            token = r.accessToken; localStorage.setItem('token', token); $('#p').value = ''; show();
        } catch (err) { toast(err.message); }
    };
    document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => tab(b.dataset.tab));
    $('#logout').onclick = logout;

    // Find a table
    $('#start').min = new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);
    $('#searchForm').onsubmit = async e => {
        e.preventDefault();
        const start = new Date($('#start').value), end = new Date(start.getTime() + $('#dur').value*60000), party = +$('#party').value;
        try {
            const list = await api(`/tables/available?start=${start.toISOString()}&end=${end.toISOString()}&partySize=${party}`);
            query = {start:start.toISOString(), end:end.toISOString(), party};
            const r = $('#results'); r.hidden = false;
            r.innerHTML = `<strong>${list.length ? 'Free tables for ' + fmt(start) : 'No free tables at ' + fmt(start)}</strong>`
                + (list.length ? '' : '<p class="muted">Try a different time or a smaller group.</p>')
                + list.map(t => `<div class="item"><div><strong>${esc(t.label)}</strong><span class="pill">${esc(t.zone.toLowerCase())}</span>
          <div><span class="seats" aria-label="${t.seats} seats">${'●'.repeat(Math.min(t.seats,12))}</span> <span class="muted">${t.seats} seats${t.description ? ', ' + esc(t.description) : ''}</span></div></div>
          <button class="small" data-book="${t.id}">Book</button></div>`).join('');
        } catch (err) { toast(err.message); }
    };
    $('#results').onclick = async e => {
        const id = e.target.dataset.book; if (!id) return;
        try {
            await api('/bookings', {method:'POST', body:JSON.stringify({tableId:+id, startTime:query.start, endTime:query.end, partySize:query.party})});
            toast('Booked.'); $('#results').hidden = true; tab('mine');
        } catch (err) { toast(err.message); }
    };

    // My bookings
    async function loadMine(){
        try {
            const list = await api('/bookings/my');
            $('#mine').innerHTML = '<h1>My bookings</h1>' + (list.length ? list.map(b => `<div class="item"><div>
        <strong>${esc(b.tableLabel)}</strong><span class="pill ${b.status}">${b.status.toLowerCase()}</span>
        <div class="muted">${fmt(b.startTime)} to ${clock(b.endTime)}, ${b.partySize} guests</div></div>
        ${b.status === 'CONFIRMED' && new Date(b.startTime) > new Date() ? `<button class="ghost small" data-cancel="${b.id}">Cancel booking</button>` : ''}</div>`).join('')
                : '<p class="muted">No bookings yet. Find a table to make your first one.</p>');
        } catch (err) { toast(err.message); }
    }
    $('#mine').onclick = async e => {
        const id = e.target.dataset.cancel; if (!id || !confirm('Cancel this booking?')) return;
        try { await api('/bookings/' + id, {method:'DELETE'}); toast('Booking cancelled.'); loadMine(); }
        catch (err) { toast(err.message); }
    };

    // Manage tables (admin)
    let tableList = [], editingId = null;
    function resetForm(){
        editingId = null; $('#tableForm').reset(); $('#ts').value = 4;
        $('#formTitle').textContent = 'Add a table'; $('#tableBtn').textContent = 'Add table'; $('#tableCancel').hidden = true;
    }
    async function loadTables(){
        try {
            tableList = await api('/tables');
            $('#tables').innerHTML = tableList.length ? tableList.map(t => `<div class="item"><div><strong>${esc(t.label)}</strong><span class="pill">${esc(t.zone.toLowerCase())}</span>${t.active ? '' : '<span class="pill CANCELLED">inactive</span>'}
        <div class="muted">${t.seats} seats${t.description ? ', ' + esc(t.description) : ''}</div></div>
        <div><button class="ghost small" data-edit="${t.id}">Edit</button>${t.active ? ` <button class="ghost small" data-off="${t.id}">Deactivate</button>` : ''}</div></div>`).join('')
                : '<p class="muted">No tables yet. Add your first one above.</p>';
        } catch (err) { toast(err.message); }
    }
    $('#tableForm').onsubmit = async e => {
        e.preventDefault();
        const body = JSON.stringify({label:$('#tl').value, description:$('#td').value || null, seats:+$('#ts').value, zone:$('#tz').value, active:$('#ta').checked});
        try {
            if (editingId) { await api('/tables/' + editingId, {method:'PUT', body}); toast('Table updated.'); }
            else { await api('/tables', {method:'POST', body}); toast('Table added.'); }
            resetForm(); loadTables();
        } catch (err) { toast(err.message); }
    };
    $('#tableCancel').onclick = resetForm;
    $('#tables').onclick = async e => {
        const edit = e.target.dataset.edit, off = e.target.dataset.off;
        if (edit) {
            const t = tableList.find(x => x.id == edit); if (!t) return;
            editingId = t.id; $('#tl').value = t.label; $('#td').value = t.description || ''; $('#ts').value = t.seats; $('#tz').value = t.zone; $('#ta').checked = t.active;
            $('#formTitle').textContent = 'Edit table ' + t.label; $('#tableBtn').textContent = 'Save changes'; $('#tableCancel').hidden = false;
            $('#tableForm').scrollIntoView({block:'center'}); $('#tl').focus();
        } else if (off) {
            try { await api('/tables/' + off, {method:'DELETE'}); toast('Table deactivated.'); loadTables(); }
            catch (err) { toast(err.message); }
        }
    };

    // All bookings (admin)
    let allPage = 0;
    async function loadAll(page = 0){
        allPage = page;
        try {
            const sel = $('#ft'), keep = sel.value; sel.length = 1;
            (await api('/tables')).forEach(t => sel.add(new Option(t.label, t.id))); sel.value = keep;
            const q = new URLSearchParams({page, size:10, sort:'startTime', dir:$('#fo').value});
            if ($('#fs').value) q.set('status', $('#fs').value);
            if (sel.value) q.set('tableId', sel.value);
            if ($('#fe').value.trim()) q.set('email', $('#fe').value.trim());
            if ($('#ff').value) q.set('from', new Date($('#ff').value + 'T00:00').toISOString());
            if ($('#fto').value) { const d = new Date($('#fto').value + 'T00:00'); d.setDate(d.getDate() + 1); q.set('to', d.toISOString()); }
            const r = await api('/bookings?' + q);
            $('#allList').innerHTML = (r.content.length ? r.content.map(b => `<div class="item"><div><strong>${esc(b.tableLabel)}</strong><span class="pill ${b.status}">${b.status.toLowerCase()}</span>
        <div class="muted">${fmt(b.startTime)} to ${clock(b.endTime)}, ${b.partySize} guests, ${esc(b.userEmail)}</div></div>
        ${b.status === 'CONFIRMED' ? `<button class="ghost small" data-cancel="${b.id}">Cancel booking</button>` : ''}</div>`).join('')
                    : '<p class="muted">No bookings match these filters.</p>')
                + `<div class="pager"><button class="ghost small" data-page="${r.page - 1}" ${r.page === 0 ? 'disabled' : ''}>Previous</button>
         <span class="muted">Page ${r.page + 1} of ${Math.max(r.totalPages, 1)}, ${r.totalElements} bookings</span>
         <button class="ghost small" data-page="${r.page + 1}" ${r.page + 1 >= r.totalPages ? 'disabled' : ''}>Next</button></div>`;
        } catch (err) { toast(err.message); }
    }
    $('#filterForm').onsubmit = e => { e.preventDefault(); loadAll(0); };
    $('#fclear').onclick = () => { $('#filterForm').reset(); loadAll(0); };
    $('#allList').onclick = async e => {
        if (e.target.dataset.page !== undefined) { loadAll(+e.target.dataset.page); return; }
        const id = e.target.dataset.cancel; if (!id || !confirm('Cancel this booking?')) return;
        try { await api('/bookings/' + id, {method:'DELETE'}); toast('Booking cancelled.'); loadAll(allPage); }
        catch (err) { toast(err.message); }
    };

    show();
</script>
</body>
</html>
