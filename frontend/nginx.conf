server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;

    # API calls go to the Spring Boot container (service name "app" in docker-compose.yml)
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API documentation
    location ~ ^/(swagger-ui|v3/api-docs) {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    # Built files have hashed names, so browsers can cache them for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths (like /bookings after a reload) serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
